<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avium Maps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,300&family=Roboto+Condensed:wght@700&display=swap">
  <!-- Linked here rather than imported from main.ts. An import only reaches the
       page once the module graph has loaded, and the dev server serves that graph
       a file at a time, so the browser painted the whole unstyled document first:
       Leaflet's controls in the normal flow, every panel stacked down the page.
       A link in the head blocks the first paint until the styles are there. -->
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="map"></div>
  <div id="place-rail">
    <img id="place-banner" alt="Avium Maps">
    <div id="place-count" class="pp-count"></div>
    <div class="pp-nav">
      <button class="pp-tab is-on" data-tab="cities">
        <span class="pp-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span>
        <span>Cities</span>
      </button>
      <button class="pp-tab" data-tab="labels">
        <span class="pp-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"/><path d="M4 12h13"/><path d="M4 17h7"/><circle cx="19" cy="7" r="1.6"/></svg></span>
        <span>Labels</span>
      </button>
      <button id="place-save" class="pp-tab pp-act" title="Write cities.json, labels.json and stations.json">
        <span class="pp-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/></svg></span>
        <span>Save</span>
      </button>
      <button id="place-drop-local" class="pp-tab pp-act pp-danger-nav" title="Throw away the browser's copy of every placement and reload from the files on disk">
        <span class="pp-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 18 17"/><path d="M20 5v6h-6"/></svg></span>
        <span>Reset</span>
      </button>
    </div>
  </div>
  <div id="place-panel">
    <div class="pp-search-row">
      <input id="place-search" type="text" autocomplete="off">
    </div>
    <ul id="place-results"></ul>
    <div class="pp-edit-row" id="edit-row" hidden>
      <input id="place-rename" type="text" placeholder="Name" autocomplete="off">
      <select id="place-kind"></select>
      <button id="place-delete" class="pp-danger" title="Delete this label or station">Delete</button>
    </div>
    <div class="pp-span-row" id="span-row" hidden>
      <label for="place-span" id="span-label">Span</label>
      <input id="place-span" type="number" min="1" step="10">
      <button class="pp-preset" id="size-major" hidden>Major</button>
      <button class="pp-preset" id="size-minor" hidden>Minor</button>
      <button class="pp-preset" id="size-islet" hidden>Islet</button>
      <span id="span-readout"></span>
    </div>
    <div id="place-status"></div>
    <div class="pp-toolbar">
      <button id="place-add-label" data-for="labels" title="Add a territory label">+ Label</button>
      <button id="place-add-station" data-for="labels" title="Add a research station">+ Station</button>
    </div>
  </div>
  <div id="ui-left">
  <div id="bottom-sheet">
    <img id="bs-banner" alt="Avium">
    <div id="bs-home">
      <input id="bs-search" type="search" placeholder="Search Avium" autocomplete="off">
      <ul id="bs-results"></ul>
      <div class="bs-buttons">
        <button class="bs-btn" data-view="all">
          <span class="bs-circle bs-blue"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span>
          <span class="bs-btn-label">Cities</span>
        </button>
        <button class="bs-btn" data-view="nations">
          <span class="bs-circle bs-orange"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 3v18" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M8 4h9l-2.5 3.5L17 11H8z" fill="#fff"/></svg></span>
          <span class="bs-btn-label">Nations</span>
        </button>
        <button class="bs-btn" data-view="export">
          <span class="bs-circle bs-green"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M8.5 11.5 12 15l3.5-3.5"/><path d="M7 11H6a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1"/></svg></span>
          <span class="bs-btn-label">Export</span>
        </button>
        <button class="bs-btn" data-view="measure">
          <span class="bs-circle bs-purple"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="9" width="18" height="6.5" rx="1.5"/><path d="M7.5 9v3M12 9v3M16.5 9v3"/></svg></span>
          <span class="bs-btn-label">Measure</span>
        </button>
        <button class="bs-btn" data-view="settings">
          <span class="bs-circle bs-grey"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7.5h8"/><path d="M18 7.5h2"/><circle cx="15" cy="7.5" r="2.4"/><path d="M4 16.5h2"/><path d="M12 16.5h8"/><circle cx="9" cy="16.5" r="2.4"/></svg></span>
          <span class="bs-btn-label">Settings</span>
        </button>
      </div>
    </div>
  </div>
  <div id="bs-list" hidden>
    <div class="bs-list-head">
      <button id="bs-back" aria-label="Back">‹</button>
      <span id="bs-title"></span>
    </div>
    <div class="bs-controls">
      <div class="bs-filter-row">
        <input id="bs-filter" type="search" placeholder="Search" autocomplete="off">
        <div class="bs-sortwrap">
          <button id="bs-sort-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <ul id="bs-sort-menu" hidden></ul>
        </div>
      </div>
    </div>
    <ul id="bs-items"></ul>
  </div>
  </div>
  <div id="measure-bar" hidden>
    <span id="measure-total">Click the map</span>
    <button id="measure-undo">Undo</button>
    <button id="measure-clear">Clear</button>
    <button id="measure-done">Done</button>
  </div>
  <div id="lightbox" hidden><img alt=""></div>
  <div class="coord-display">Move mouse over map</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
